name: Decision Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: decision-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -e .

      - run: npm install -g @anthropic-ai/claude-code

      # --explain writes the pipeline's reasoning (ref resolution, ignore-filter
      # drops, per-decision selection, review candidates, verify uphold/drop,
      # and findings hidden by the severity threshold) to stderr, which lands in
      # this step's log. That way a run that posts no comment can still be
      # checked here to confirm it genuinely reviewed the diff and found
      # nothing, rather than having silently selected zero decisions.
      - run: decision-agent review --explain
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
